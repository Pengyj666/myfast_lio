%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 2  

imu_topic: "/vio/imu"
image0_topic: "/vio/left/image_raw/compressed"
image1_topic: "/vio/right/image_raw/compressed"
output_path: "~/output/"

cam0_calib: "sn201_new_cam0.yaml"
cam1_calib: "sn201_new_cam1.yaml"
image_width: 640
image_height: 480


# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-1.0,  0.0, 0.0, 0.05143,
          0.0,  1.0, 0.0, -0.00453,
          0.0,  0.0, -1.0, -0.01503,
          0, 0, 0, 1]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.999913, -0.00954264, -0.00909509,  -0.00866357,
          -0.00950546,    0.999946, -0.00411761, -0.00472331,
          0.0091339, -0.00403079,    -0.99995, -0.0147095,
          0, 0, 0, 1]

